name: HiWaldorf legacy YT plugins compatibility

on:
  pull_request:
    paths:
      - 'hiwaldorf-yt-plugins/**'
      - '.github/workflows/yt-plugins-compat.yml'
  workflow_dispatch:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP lint for all four original theme plugins
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find hiwaldorf-yt-plugins -type f -name '*.php' -print0)

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript parse check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find hiwaldorf-yt-plugins -type f -name '*.js' -print0)
