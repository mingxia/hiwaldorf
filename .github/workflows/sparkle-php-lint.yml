name: Sparkle PHP compatibility checks

on:
  pull_request:
    paths:
      - 'yeahthemes-sparkle/**'
      - 'sparkle-childtheme/**'
      - '.github/workflows/sparkle-php-lint.yml'
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Inventory and heuristic scan of every theme file
        if: matrix.php == '8.3'
        run: python3 scripts/sparkle_static_audit.py
      - name: Upload full file inventory and findings
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-full-file-audit
          path: sparkle-static-audit.md
      - name: Lint all theme PHP files
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              failed=1
            fi
          done < <(find yeahthemes-sparkle sparkle-childtheme -type f -name '*.php' -print0)
          exit "$failed"
