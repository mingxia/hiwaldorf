name: Sparkle PHP compatibility checks

on:
  pull_request:
    paths:
      - 'yeahthemes-sparkle/**'
      - 'sparkle-childtheme/**'
      - '.github/workflows/sparkle-php-lint.yml'
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Lint all theme PHP files
        shell: bash
        run: |
          set -euo pipefail
          find yeahthemes-sparkle sparkle-childtheme -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done
